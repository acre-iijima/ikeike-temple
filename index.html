<!doctype html>
<html lang="ja">
<head>

<style>
/* Layout: one phone-tall column, the canvas fills it and is the touch surface; menus float over the running game */
:root{
  --ink:#2b1d3a; --cream:#fff7ea; --sun:#ffcf3f; --pink:#ff5fa2; --sky:#4fc3ff; --lava:#ff4a2e; --pad:#5b4580;
  --display:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--ink);color:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#1a1226}
#wrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px;text-align:center;z-index:5}
.dim{background:rgba(26,16,40,.62);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.btn{font-family:var(--display);font-size:24px;padding:12px 30px;border-radius:999px;border:4px solid var(--ink);background:var(--sun);color:var(--ink);
  box-shadow:0 6px 0 var(--ink);cursor:pointer;min-width:220px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.mini:focus-visible,.tile:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.btn.alt{background:var(--sky)}
.btn.ghost{background:var(--cream);font-size:19px}
.btn.big{font-size:34px;padding:14px 48px;animation:throb 1s ease-in-out infinite}
.mini{font-family:var(--body);font-weight:800;font-size:15px;padding:8px 16px;border-radius:999px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer}
@keyframes throb{50%{transform:scale(1.07)}}
/* title */
#title{justify-content:flex-start;padding-top:9vh}
.logo{margin:0;font-family:var(--display);font-weight:400;line-height:1.05;display:flex;flex-direction:column;align-items:center}
.logo .row{display:flex}
.logo .ch{display:inline-block;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;animation:hop 1.2s ease-in-out infinite}
.logo .r1 .ch{font-size:46px}
.logo .r2 .ch{font-size:66px}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12px) rotate(-6deg)}}
.sub{margin:0;font-weight:800;font-size:15px;color:#fff;background:rgba(43,29,58,.72);padding:6px 14px;border-radius:999px;max-width:100%}
.howto{font-weight:800;font-size:14px;line-height:1.6;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:8px 14px}
.spacer{flex:1}
/* select */
#select{justify-content:flex-start;padding-top:18px;gap:10px}
.selhead{display:flex;align-items:center;gap:10px;width:100%;max-width:400px}
.selhead h2{margin:0;flex:1;font-family:var(--display);font-weight:400;font-size:22px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-align:left}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:400px;overflow-y:auto;padding:4px 2px 8px}
.tile{position:relative;aspect-ratio:1/1.05;max-width:100%;border-radius:18px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);
  font-family:var(--display);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 var(--ink);cursor:pointer;padding:0}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tile .st{font-family:var(--body);font-size:12px;letter-spacing:1px;color:#c9bca9}
.tile.hard .st{-webkit-text-stroke:0;color:rgba(255,255,255,.55)}
.tile .st b{color:#ffb800;font-weight:800}
.tile.t0{background:#c9f2a8}.tile.t1{background:#ffd0e4}.tile.t2{background:#d6ecff}.tile.t3{background:#ffe0a8}
.tile.hard{background:linear-gradient(160deg,#ff8a3d,#e8232a);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.tile.hard::after{content:"激";position:absolute;top:-8px;right:-6px;font-size:13px;-webkit-text-stroke:0;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:1px 4px}
.tile.locked{background:#6d6080;color:#a99bbd;-webkit-text-stroke:0;box-shadow:0 5px 0 #2b1d3a}
.tile.locked .num{font-size:22px}
.legend{margin:0;font-weight:800;font-size:13px;color:#fff}
/* cards */
.card{background:var(--cream);border:4px solid var(--ink);border-radius:28px;padding:18px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:340px;box-shadow:0 8px 0 var(--ink);animation:cardIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes cardIn{from{transform:scale(.5) rotate(-4deg);opacity:0}}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;color:var(--sun);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-wrap:balance}
.card h2.fail{color:var(--sky)}
.tag{margin:0;font-weight:800;font-size:13px;letter-spacing:.08em;background:var(--ink);color:#fff;padding:3px 12px;border-radius:999px}
.msg{margin:0;font-weight:800;font-size:15px;line-height:1.5}
.stars{display:flex;gap:6px;font-size:50px;line-height:1}
.stars span{color:#d8ccbb;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:scale(.6);transition:transform .3s cubic-bezier(.2,1.8,.4,1),color .2s}
.stars span.on{color:var(--sun);transform:scale(1.1)}
.stats{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.stats div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 2px}
.stats dt{font-size:10px;font-weight:800;color:#7b6a8c}
.stats dd{margin:0;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.best{margin:0;font-family:var(--display);font-size:16px;color:var(--pink);animation:throb .6s infinite}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:4px}
#endUi{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;z-index:5}
#pauseBtn{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:var(--cream);font-family:var(--display);font-size:16px;color:var(--ink);z-index:4;padding:0}
#rotate{position:fixed;display:none;background:var(--ink);color:#fff;z-index:50;font-family:var(--display);font-size:24px}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){.logo .ch,.btn.big,.best{animation:none}}
@media (max-height:640px){#title{padding-top:3vh}.logo .r2 .ch{font-size:56px}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <button id="pauseBtn" aria-label="ひとやすみ" hidden>II</button>

    <div id="title" class="ov">
      <h1 class="logo" aria-label="行け！行け！てんぷる"><span class="row r1">行け！行け！</span><span class="row r2">てんぷる</span></h1>
      <p class="sub">ラグドールの てんぷるが はしる！</p>
      <div class="spacer"></div>
      <button id="playBtn" class="btn big">あそぶ！</button>
      <div class="howto">ひだりはんぶんを なぞって いどう<br>みぎはんぶんを タップで ジャンプ！<br>ほしで むてき！ きんの さかなで フィーバー！</div>
      <button id="muteBtn" class="mini">おと：オン</button>
    </div>

    <div id="select" class="ov dim" hidden>
      <div class="selhead"><button id="selBack" class="mini">◀ もどる</button><h2 id="selHead">ステージを えらぼう</h2></div>
      <div id="grid" class="grid"></div>
      <p class="legend">16〜20 は 激ムズ！ クリアで つぎが ひらくよ</p>
      <button id="selEnd" class="mini" hidden>エンディングを みる</button>
    </div>

    <div id="pause" class="ov dim" hidden>
      <div class="card">
        <h2>ひとやすみ</h2>
        <div class="btns">
          <button id="pResume" class="btn">つづける</button>
          <button id="pRetry" class="btn alt">さいしょから</button>
          <button id="pQuit" class="btn ghost">ステージを えらぶ</button>
          <button id="pMute" class="mini">おと：オン</button>
        </div>
      </div>
    </div>

    <div id="endUi" class="endui" hidden><button id="endBtn" class="btn ghost">タイトルへ もどる</button></div>

    <div id="result" class="ov dim" hidden>
      <div class="card">
        <p id="rsTag" class="tag">ステージ 1</p>
        <h2 id="rsTitle">ステージクリア！</h2>
        <div id="rsStars" class="stars" aria-label="ほし"><span>★</span><span>★</span><span>★</span></div>
        <p id="rsMsg" class="msg"></p>
        <dl class="stats">
          <div><dt>スコア</dt><dd id="rsScore">0</dd></div>
          <div><dt>さかな</dt><dd id="rsFish">0</dd></div>
          <div><dt>さいだいコンボ</dt><dd id="rsCombo">0</dd></div>
        </dl>
        <p id="rsBest" class="best" hidden>ハイスコア こうしん！</p>
        <div class="btns">
          <button id="rsNext" class="btn">つぎへ ▶</button>
          <button id="rsRetry" class="btn alt">もういちど</button>
          <button id="rsSel" class="btn ghost">ステージを えらぶ</button>
        </div>
      </div>
    </div>
  </div>
  </div>
  <div id="rotate" class="ov">iPhoneを たてに してね</div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), wrap=$('wrap');
const W=360, R=14, CAT_SPEED=330, JD=0.62, JH=54, STEP=8;
let H=640, scale=1, dpr=1, PY=520;
const FONT='"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif';
const INK='#2b1d3a';

/* ---------- helpers ---------- */
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const easeBack=t=>{const c=1.9;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

/* ---------- save ---------- */
const SAVE_KEY='tenpuru-save-v1';
let save={unlocked:1,stars:{},best:{},muted:false};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&s.unlocked)save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- audio ---------- */
let AC=null,master,musicGain,sfxGain,noiseBuf,muted=!!save.muted;
function initAudio(){
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
      AC=new A(); master=AC.createGain(); master.gain.value=muted?0:0.9; master.connect(AC.destination);
      musicGain=AC.createGain(); musicGain.gain.value=0.55; musicGain.connect(master);
      sfxGain=AC.createGain(); sfxGain.gain.value=0.8; sfxGain.connect(master);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const b=AC.createBufferSource(); b.buffer=AC.createBuffer(1,1,22050); b.connect(AC.destination); b.start(0);
      setInterval(sched,25);
    }
    if(AC.state==='suspended')AC.resume();
    if(bgmOn&&bgmWant>=0){if(bgm&&bgmCur===bgmWant){if(bgm.paused&&!document.hidden)bgmPlay();}else music(bgmWant);}
  }catch(e){}
}
['pointerdown','touchend','click','keydown'].forEach(t=>document.addEventListener(t,initAudio,{passive:true}));
function setMuted(m){muted=m;save.muted=m;persist();if(master)master.gain.value=m?0:0.9;
  ['muteBtn','pMute'].forEach(id=>$(id).textContent='おと：'+(m?'オフ':'オン'));}
function note(f,d,type,v,when,dest,f2){
  if(!AC)return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,when);if(f2)o.frequency.exponentialRampToValueAtTime(f2,when+d);
  g.gain.setValueAtTime(v,when);g.gain.exponentialRampToValueAtTime(0.0008,when+d);
  o.connect(g);g.connect(dest||sfxGain);o.start(when);o.stop(when+d+0.03);
}
function nz(d,v,freq,type,when,dest){
  if(!AC)return; const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(v,when);g.gain.exponentialRampToValueAtTime(0.0008,when+d);
  s.connect(f);f.connect(g);g.connect(dest||sfxGain);s.start(when);s.stop(when+d+0.03);
}
const now=()=>AC?AC.currentTime:0;
const mf=m=>440*Math.pow(2,(m-69)/12);
const SFX={
  jump(){if(!AC)return;note(330,0.2,'square',0.16,now(),0,820);},
  land(){if(!AC)return;nz(0.08,0.15,900,'lowpass',now());},
  coin(c){if(!AC)return;const f=mf(76+(c%15));note(f,0.07,'square',0.12,now());note(f*1.5,0.14,'square',0.11,now()+0.05);},
  hit(){if(!AC)return;const t=now();nz(0.35,0.5,1400,'lowpass',t);note(220,0.35,'sawtooth',0.25,t,0,55);},
  boom(){if(!AC)return;const t=now();nz(0.5,0.6,700,'lowpass',t);note(140,0.4,'square',0.22,t,0,35);},
  wall(){if(!AC)return;nz(0.12,0.25,2500,'bandpass',now());},
  power(){if(!AC)return;const t=now();[72,76,79,84,88,91,96].forEach((m,i)=>note(mf(m),0.18,'square',0.13,t+i*0.05));},
  praise(){if(!AC)return;const t=now();[79,83,86,91].forEach((m,i)=>note(mf(m),0.16,'triangle',0.2,t+i*0.06));note(mf(98),0.4,'square',0.08,t+0.24);},
  bonus(){if(!AC)return;const t=now();note(mf(84),0.08,'square',0.12,t);note(mf(91),0.15,'square',0.12,t+0.06);},
  heart(){if(!AC)return;const t=now();[72,79,84].forEach((m,i)=>note(mf(m),0.2,'triangle',0.25,t+i*0.08));},
  count(go){if(!AC)return;note(go?mf(84):mf(72),go?0.45:0.16,'square',0.18,now());},
  clear(){if(!AC)return;const t=now();[[72,0],[76,.12],[79,.24],[84,.36],[79,.52],[84,.64]].forEach(([m,d])=>note(mf(m),0.22,'square',0.16,t+d));
    [72,76,79,84].forEach(m=>note(mf(m),1.1,'triangle',0.12,t+0.82));nz(0.6,0.15,6000,'highpass',t+0.82);},
  fail(){if(!AC)return;const t=now();[67,63,60,55].forEach((m,i)=>note(mf(m),0.28,'triangle',0.22,t+i*0.2));},
  click(){if(!AC)return;note(mf(88),0.06,'square',0.1,now());}
};
const SONGS=[
  {bpm:148,lead:[72,0,76,79,0,76,72,0,74,0,77,81,0,79,77,76,72,0,76,79,0,84,83,81,79,77,76,74,72,0,0,0],
   bass:[48,0,55,0,48,0,55,0,50,0,57,0,50,0,57,0,53,0,60,0,53,0,60,0,55,0,55,0,43,0,47,0]},
  {bpm:156,lead:[67,71,74,79,0,74,71,74,69,72,76,81,0,76,72,76,71,74,78,83,0,78,74,78,79,0,78,0,76,0,74,0],
   bass:[43,0,50,0,43,0,50,0,45,0,52,0,45,0,52,0,47,0,54,0,47,0,54,0,50,0,50,0,38,0,42,0]},
  {bpm:174,lead:[69,0,72,76,0,72,69,0,67,0,71,74,0,71,67,0,65,0,69,72,0,69,77,76,75,0,76,0,64,0,0,0],
   bass:[45,45,57,45,45,57,45,57,43,43,55,43,43,55,43,55,41,41,53,41,41,53,41,53,40,40,52,40,44,44,56,44]},
  {bpm:190,hyper:true,lead:[84,0,84,86,88,0,91,0,88,86,84,0,79,0,81,84,86,0,86,88,89,0,93,0,91,89,88,86,84,86,88,91],
   bass:[48,60,48,60,48,60,48,60,45,57,45,57,45,57,45,57,41,53,41,53,41,53,41,53,43,55,43,55,43,55,47,59]}
];
let song=null,step=0,nextT=0;
function playSong(i){if(!AC){song=SONGS[i];step=0;nextT=0;return;}song=SONGS[i];step=0;nextT=AC.currentTime+0.06;}
function stopSong(){song=null;}
/* recorded songs: one <audio> routed through WebAudio so mute/ducking work on iPhone; keeps playing until the track changes */
const TRACKS=['song1','song2','song3','song4','song5','song6','ending','song1-part2'],TRACK_SYN=[0,1,2,1,2,3,0,0],BGM_VOL=0.5;
let bgm=null,bgmGain=null,bgmCur=-1,bgmWant=-1,bgmOn=false;const bgmBad={};
function stageTrack(n){return n>=20?5:n>=17?4:Math.floor((n-1)/4);}
function bgmInit(){
  if(bgm||!AC)return;
  try{
    bgm=new Audio();bgm.loop=true;bgm.preload='auto';bgm.setAttribute('playsinline','');
    const src=AC.createMediaElementSource(bgm);bgmGain=AC.createGain();bgmGain.gain.value=BGM_VOL;src.connect(bgmGain);bgmGain.connect(master);
    bgm.addEventListener('error',()=>{if(bgmCur<0)return;bgmBad[bgmCur]=1;const w=bgmCur;bgmCur=-1;if(bgmOn&&w===bgmWant)music(w);});
  }catch(e){bgm=null;}
}
function bgmPlay(){if(!bgm||bgmCur<0)return;try{const p=bgm.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function music(i){
  bgmWant=i;bgmOn=true;if(!AC)return;bgmInit();
  if(!bgm||bgmBad[i]){if(bgm)bgm.pause();bgmCur=-1;if(song!==SONGS[TRACK_SYN[i]])playSong(TRACK_SYN[i]);return;}
  stopSong();
  if(bgmCur!==i){bgmCur=i;bgm.src='audio/'+TRACKS[i]+'.mp4';}
  bgmPlay();
}
function bgmPause(){bgmOn=false;stopSong();if(bgm)bgm.pause();}
function duck(v,t){if(!bgmGain)return;const g=bgmGain.gain,now=AC.currentTime;g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(BGM_VOL*v,now+(t||0.3));}
function sched(){
  if(!AC||!song)return;
  if(nextT<AC.currentTime)nextT=AC.currentTime+0.05;
  const fev=G&&G.fever>0&&!G.demo;
  const spb=60/(song.bpm*(fev?1.2:1))/2;
  while(nextT<AC.currentTime+0.15){
    const i=step%32,L=song.lead[i],B=song.bass[i];
    if(L){note(mf(L),spb*0.9,'square',0.075,nextT,musicGain);if(fev)note(mf(L+12),spb*0.6,'square',0.04,nextT,musicGain);}
    if(B)note(mf(B),spb*0.95,'triangle',0.25,nextT,musicGain);
    if(i%4===0||(song.hyper&&i%4===2))note(150,0.13,'sine',0.45,nextT,musicGain,40);
    if(song.hyper&&B)note(mf(B+24+[0,4,7,12][i%4]),spb*0.5,'square',0.03,nextT,musicGain);
    if(i%2===1)nz(0.035,0.05,7000,'highpass',nextT,musicGain);
    if(i%8===4)nz(0.12,0.12,1800,'bandpass',nextT,musicGain);
    nextT+=spb;step++;
  }
}

function themeOf(n){return n>=20?10:Math.min(9,Math.ceil(n/2)-1);}
function stageParams(n){
  const hard=n>15,k=n<=1?0:(n-2)/13,kk=hard?(n-16)/4:0;
  const p={n,hard,theme:themeOf(n)};
  if(n===1){
    Object.assign(p,{speed:165,length:165*24,minHW:120,maxHW:150,wiggle:40,seg:240,gateChance:0,gap:340,rowChance:0,pairChance:0,splitChance:0,laneMin:80});
  }else if(!hard){
    p.speed=205+k*100;                 // 205..305
    p.length=Math.round(p.speed*(25+k*13));
    p.minHW=92-k*38;                   // 92..54
    p.maxHW=122-k*36;                  // 122..86
    p.wiggle=70+k*70;
    p.seg=215-k*75;
    p.gateChance=0.15+k*0.2;
    p.gap=255-k*105;                   // 255..150
    p.rowChance=n>=4?0.06+k*0.08:0;
    p.pairChance=n>=6?0.1+k*0.12:0;
    p.splitChance=n>=3?0.22+k*0.18:(n===2?0.14:0);
    p.laneMin=74-k*20;                 // 74..54
  }else{
    p.speed=325+kk*50;                 // 325..375
    p.length=Math.round(p.speed*(40+kk*8));
    p.minHW=50-kk*8;                   // 50..42
    p.maxHW=78-kk*10;
    p.wiggle=140+kk*30;
    p.seg=140-kk*20;
    p.gateChance=0.4;
    p.gap=128-kk*28;                   // 128..100
    p.rowChance=0.18;p.pairChance=0.3;p.splitChance=0.42;
    p.laneMin=50-kk*6;                 // 50..44
  }
  p.cs=Math.max(330,p.speed*1.08);
  p.types=['rock'];if(n>=2)p.types.push('cucumber','box');if(n>=3)p.types.push('dog');if(n>=5)p.types.push('yarn');
  if(hard)p.types.push('dog','yarn','dog');
  p.dogSpeed=60+n*7;p.yarnSpeed=70+n*8;
  return p;
}
function genTerrain(p,rng){
  const total=p.length+1400,N=Math.ceil(total/STEP)+2;
  const C=new Float32Array(N),HW=new Float32Array(N),IC=new Float32Array(N),IW=new Float32Array(N);
  const pts=[{y:0,c:180,hw:150},{y:380,c:180,hw:Math.min(150,p.maxHW+20)}];
  const splits=[];
  let y=380,c=180,lastSplit=0;
  const maxSlope=Math.min(0.9,0.55*p.cs/p.speed);
  while(y<p.length){
    if(p.splitChance&&y>800&&y<p.length-1300&&y-lastSplit>650&&rng()<p.splitChance){
      const shw=148+rng()*12,tc=clamp(c,shw+12,W-shw-12);
      y+=Math.max(150,Math.abs(tc-c)/maxSlope*1.1);pts.push({y,c:tc,hw:shw});c=tc;
      const taper=120,body=240+rng()*(p.hard?420:320),y0=y+10,y3=y0+taper*2+body;
      const laneL=p.laneMin+rng()*22,laneR=p.laneMin+rng()*22,l=tc-shw+laneL,r=tc+shw-laneR;
      splits.push({y0,y1:y0+taper,y2:y0+taper+body,y3,ic:(l+r)/2,iw:(r-l)/2});
      y=y3+10;pts.push({y,c:tc,hw:shw});
      y+=Math.max(200,(shw-p.maxHW)/maxSlope*1.1);pts.push({y,c:tc,hw:p.maxHW});
      lastSplit=y;continue;
    }
    const seg=p.seg*(0.7+rng()*0.6);
    let hw=p.minHW+rng()*(p.maxHW-p.minHW);
    if(rng()<p.gateChance)hw=p.minHW;
    let nc=c+(rng()*2-1)*p.wiggle;
    if(p.n>=6&&rng()<0.3)nc=c+(c>180?-1:1)*p.wiggle*1.2;
    nc=clamp(nc,hw+10,W-hw-10);
    const lim=maxSlope*seg; nc=clamp(nc,c-lim,c+lim);
    y+=seg;pts.push({y,c:nc,hw});c=nc;
  }
  const gl=Math.max(260,Math.abs(c-180)/maxSlope+40);
  pts.push({y:y+gl,c:180,hw:140},{y:Math.max(total,y+gl)+600,c:180,hw:140});
  let j=0;
  for(let i=0;i<N;i++){
    const wy=i*STEP; while(j<pts.length-2&&pts[j+1].y<wy)j++;
    const a=pts[j],b=pts[j+1],t=clamp((wy-a.y)/(b.y-a.y),0,1),s=t*t*(3-2*t);
    C[i]=a.c+(b.c-a.c)*s;HW[i]=a.hw+(b.hw-a.hw)*s;
  }
  for(const sp of splits){
    for(let i=Math.floor(sp.y0/STEP);i<=Math.ceil(sp.y3/STEP)&&i<N;i++){
      const wy=i*STEP;let f=0;
      if(wy<sp.y0||wy>sp.y3)f=0;else if(wy<sp.y1)f=(wy-sp.y0)/(sp.y1-sp.y0);else if(wy<=sp.y2)f=1;else f=(sp.y3-wy)/(sp.y3-sp.y2);
      f=f*f*(3-2*f);IC[i]=sp.ic;IW[i]=sp.iw*f;
    }
  }
  return {C,HW,IC,IW,n:N,splits};
}
function tAt(T,wy){const f=clamp(wy/STEP,0,T.n-1.001),i=f|0,u=f-i;return [T.C[i]+(T.C[i+1]-T.C[i])*u,T.HW[i]+(T.HW[i+1]-T.HW[i])*u];}
function iAt(T,wy){const f=clamp(wy/STEP,0,T.n-1.001),i=f|0,u=f-i;return [T.IC[i]+(T.IC[i+1]-T.IC[i])*u,T.IW[i]+(T.IW[i+1]-T.IW[i])*u];}
function inSplit(T,y,m){return T.splits.some(s=>y>s.y0-m&&y<s.y3+m);}
// usable x range at height y for something of radius r, on the side of the island that x is on
function laneRange(T,x,y,r){
  const [c,hw]=tAt(T,y),[ic,iw]=iAt(T,y);let lo=c-hw+r,hi=c+hw-r;
  if(iw>0.5){if(x<ic)hi=Math.min(hi,ic-iw-r);else lo=Math.max(lo,ic+iw+r);}
  return [lo,hi];
}
function mkObs(type,x,y,rng,p){
  const o={type,x,y,r:15,rot:rng()*6.28,vx:0,vy:0,ph:rng()*100,dead:false,passed:false,jumped:false,near:false,active:false};
  if(type==='rock'||type==='box')o.r=16;
  if(type==='cucumber'){o.r=14;o.rot=(rng()-0.5)*0.9;}
  if(type==='dog'){o.r=16;o.vx=(rng()<0.5?-1:1)*p.dogSpeed*(0.8+rng()*0.4);}
  if(type==='yarn'){o.r=13;o.vy=p.yarnSpeed*(0.8+rng()*0.4);o.y+=o.vy*560/(p.speed+o.vy);}
  return o;
}
function genObstacles(p,rng,T){
  const out=[],jl=p.speed*JD;let y=700,lastRow=-1e9;
  for(;;){
    y+=p.gap*(0.75+rng()*0.5);
    if(y>p.length-150)break;
    const [c,hw]=tAt(T,y),split=inSplit(T,y,40);
    if(!split&&p.rowChance&&rng()<p.rowChance&&hw<=115&&y-lastRow>jl*2.2){
      const cnt=Math.ceil(2*hw/32),type=rng()<0.5?'rock':'cucumber';
      for(let k=0;k<cnt;k++){const o=mkObs(type,c-hw+(k+0.5)*(2*hw/cnt),y,rng,p);o.row=true;out.push(o);}
      lastRow=y;y+=jl*0.55;continue;
    }
    const type=p.types[rng()*p.types.length|0];
    const o=mkObs(type,0,y,rng,p);
    if(split){
      if(type==='yarn')o.type='rock',o.r=16,o.vy=0,o.y=y;
      const side=rng()<0.5?c-hw+1:c+hw-1,[lo,hi]=laneRange(T,side,y,o.r+4);
      if(hi<lo)continue;o.x=lo+rng()*(hi-lo);out.push(o);continue;
    }
    o.x=c+(rng()*2-1)*Math.max(0,hw-o.r-6);out.push(o);
    if(rng()<p.pairChance&&hw>64&&type!=='yarn'){
      const t2=rng()<0.5?'rock':'box',o2=mkObs(t2,0,y,rng,p);
      o2.x=o.x>c?c-hw+o2.r+4+rng()*16:c+hw-o2.r-4-rng()*16;out.push(o2);
    }
  }
  return out;
}
function genItems(p,rng,T,obs){
  const out=[];let y=520;
  while(y<p.length-140){
    const n=5+(rng()*4|0),ph=rng()*6.28,amp=0.2+rng()*0.6;
    for(let k=0;k<n;k++){
      const yy=y+k*42,[c,hw]=tAt(T,yy);let x=c+Math.sin(ph+k*0.6)*amp*(hw-22);
      const [lo,hi]=laneRange(T,x,yy,14);if(hi<lo)continue;x=clamp(x,lo,hi);
      if(obs.some(o=>Math.abs(o.y-yy)<34&&Math.abs(o.x-x)<34))continue;
      out.push({type:'fish',x,y:yy,got:false,ph:rng()*6});
    }
    y+=n*42+260*(0.6+rng()*0.8);
  }
  const sp=(type,f)=>{const yy=p.length*f,[c]=tAt(T,yy),[lo,hi]=laneRange(T,c-1,yy,16);out.push({type,x:clamp(c,lo,hi),y:yy,got:false,ph:0});};
  sp('gold',0.38);if(p.n>=4)sp('gold',0.72);
  if(p.n>=2)sp('star',0.18+rng()*0.12);if(p.n>=8)sp('star',0.6+rng()*0.08);if(p.hard)sp('star',0.88);
  if(p.n>=6)sp('heart',0.55);if(p.hard)sp('heart',0.86);
  return out;
}

function newRun(n,demo){

  let obs=genObstacles(p,rng,T);const items=genItems(p,rng,T,obs);
  obs=obs.filter(o=>!items.some(i=>i.type!=='fish'&&Math.abs(i.y-o.y)<70));
  G={p,n,demo:!!demo,T,obs,items,dist:0,px:180,py:PY,pw:0,star:0,z:0,jt:-1,jumpBuf:0,hearts:3,inv:0,fever:0,score:0,combo:0,maxCombo:0,

function addP(o){if(o.w){o.wy=o.y;o.y=0;}parts.push(o);if(parts.length>700)parts.shift();}

function pop(txt,x,y,o={}){pops.push({txt,x,y,vy:o.vy??-60,life:0,max:o.max||0.9,size:o.size||20,col:o.col||'#fff',big:!!o.big});if(pops.length>30)pops.shift();}

function requestJump(){if(G&&!G.demo&&(G.state==='play'||G.state==='count'))G.jumpBuf=0.16;}
function addCombo(){
  const g=G;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
  let txt=null;for(const [c,t] of PRAISE)if(g.combo===c)txt=t;

}
function mult(){return (1+Math.floor(G.combo/10))*(G.fever>0?2:1);}
function hurt(){
  const g=G;if(g.demo||g.inv>0||g.star>0||g.state!=='play')return false;

function update(dt){

  let y=gy-g.z;
  if(g.state==='dead'){o.rot=g.endT*9;y-=g.endT*140-g.endT*g.endT*60+20;o.face='hurt';}
  if(g.state==='count')o.run=g.t*3;
  if(g.star>0&&g.state!=='dead'){ctx.save();ctx.filter='hue-rotate('+((g.t*600)%360|0)+'deg) saturate(1.6) brightness(1.08)';drawCat(g.px,y,s,o);ctx.restore();}
  else drawCat(g.px,y,s,o);
}
function drawHUD(g){
  // hearts
  for(let i=0;i<3;i++){ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.fillStyle=i<g.hearts?'#ff4f7e':'rgba(255,255,255,.35)';
    const bump=i<g.hearts&&g.inv>1.2&&i===g.hearts?1.3:1;heartPath(66+i*26,28,10*bump);ctx.fill();ctx.stroke();}
  txt(String(g.score),W-12,28,24,'#fff',6,'right');
  // progress
  const x0=16,x1=W-16,y=68,pr=clamp(g.dist/g.p.length,0,1);
  ctx.fillStyle='rgba(43,29,58,.55)';ctx.beginPath();ctx.roundRect(x0-3,y-7,x1-x0+6,14,7);ctx.fill();
  const gr=ctx.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,'#4fc3ff');gr.addColorStop(1,g.p.hard?'#ff4a2e':'#ffcf3f');
  ctx.fillStyle=gr;ctx.beginPath();ctx.roundRect(x0,y-4,Math.max(8,(x1-x0)*pr),8,4);ctx.fill();
  for(let i=0;i<4;i++){ctx.fillStyle=(i%2)?'#fff':INK;ctx.fillRect(x1-4,y-8+i*4,4,4);ctx.fillStyle=(i%2)?INK:'#fff';ctx.fillRect(x1,y-8+i*4,4,4);}
  ctx.save();ctx.translate(x0+(x1-x0)*pr,y+2);ctx.scale(0.5,0.5);drawCat(0,14,1,{run:g.run,face:g.face,t:g.t});ctx.restore();
  txt('ステージ '+g.n+'  '+THEMES[g.p.theme].name,x0,92,13,'#fff',4,'left');
  if(g.combo>=3){const s=13+Math.min(10,g.combo/5);txt(g.combo+' コンボ',W-14,94,s,g.combo>=30?'rainbow':'#ffe14d',4.5,'right');
    if(mult()>1)txt('×'+mult(),W-14,94+s+2,13,'#fff',4,'right');}
  if(g.fever>0){const w=(W-32)*clamp(g.fever/6.5,0,1);ctx.fillStyle='rgba(43,29,58,.55)';ctx.fillRect(16,110+(g.combo>=3?14:0),W-32,6);
    ctx.fillStyle=RAINBOW[Math.floor(g.t*14)%6];ctx.fillRect(16,110+(g.combo>=3?14:0),w,6);}
  if(g.state==='count'){
    ctx.fillStyle='rgba(43,29,58,.5)';ctx.fillRect(0,H*0.15,W,96);
    txt('ステージ '+g.n,W/2,H*0.15+32,30,'#fff',7);
    txt(THEMES[g.p.theme].name,W/2,H*0.15+70,20,g.p.hard?'#ff8a3d':'#ffe14d',5);
    if(g.p.hard&&Math.floor(g.t*6)%2)txt('激ムズ！！',W/2,H*0.15+122,34,'#ff3b2f',7);
    if(g.n<=2){txt('ひだりで なぞって いどう',W/2,H*0.5,17,'#fff',5);txt('みぎを タップで ジャンプ！',W/2,H*0.5+28,17,'#ffe14d',5);}
    ctx.globalAlpha=0.55;ctx.setLineDash([8,8]);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,H*0.62);ctx.lineTo(W/2,H-20);ctx.stroke();ctx.setLineDash([]);
    ctx.lineWidth=3;ell(W*0.25,H*0.8,34,34);ctx.stroke();ctx.fillStyle='#ff5fa2';ell(W*0.25,H*0.8,15,15);ctx.fill();
    ctx.fillStyle='#ffe14d';ell(W*0.75,H*0.8,30,30);ctx.fill();ctx.stroke();ctx.globalAlpha=1;
    txt('いどう',W*0.25,H*0.8+54,15,'#fff',4);txt('ジャンプ',W*0.75,H*0.8+54,15,'#ffe14d',4);txt('ぴょん',W*0.75,H*0.8,13,INK,0);
  }
  if(g.fever>0||g.star>0||THEMES[g.p.theme].dopa){ctx.lineWidth=8;ctx.strokeStyle=RAINBOW[Math.floor(g.t*10)%6];ctx.strokeRect(4,4,W-8,H-8);}
  if(g.star>0){const w=(W-32)*clamp(g.star/7.5,0,1),yb=124+(g.combo>=3?14:0);ctx.fillStyle='rgba(43,29,58,.55)';ctx.fillRect(16,yb,W-32,6);ctx.fillStyle='#fff6a0';ctx.fillRect(16,yb,w,6);txt('むてき',W-14,yb+16,12,'#fff6a0',3.5,'right');}
}
function drawPops(){
  for(const p of pops){
    const a=clamp((p.max-p.life)/0.25,0,1);ctx.globalAlpha=a;
    if(p.big){const s=easeBack(p.life/0.3);ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.rotate(Math.sin(p.life*10)*0.04);txt(p.txt,0,0,p.size,p.col,p.size*0.22);ctx.restore();}
    else{const s=easeBack(p.life/0.18);ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);txt(p.txt,0,0,p.size,p.col);ctx.restore();}
  }
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  if(mode==='ending'){drawEnding();return;}
  const g=G;if(!g)return;
  ctx.save();
  if(shakeAmt>0)ctx.translate(rand(-1,1)*shakeAmt,rand(-1,1)*shakeAmt);
  drawWorld(g);drawPlayer(g);drawParts(g);drawAmb(g);
  ctx.restore();
  if(flash.a>0){ctx.globalAlpha=flash.a;ctx.fillStyle=flash.col;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(!g.demo)drawHUD(g);
  drawPops();
  if(mode==='play')drawStick();
}

/* ---------- ending ---------- */
let endT=0,endStage=0;
const CREDITS=[['おめでとう！',30,'rainbow'],['ぜん20ステージ クリア！',22,'#ffe14d'],['てんぷるは でんせつの',20,'#fff'],['ねこに なった！',20,'#fff'],['',0],
  ['しゅやく',14,'#bfe6ff'],['てんぷる（ラグドール）',22,'#fff'],['',0],['じゃまもの',14,'#bfe6ff'],['いぬ・きゅうり・けいとだま',18,'#fff'],['いわ・ダンボール',18,'#fff'],['',0],
  ['おうえん',14,'#bfe6ff'],['さかなの みんな',18,'#fff'],['',0],['ぼうけんした ばしょ',14,'#bfe6ff'],['はらっぱ・おかしのくに',17,'#fff'],['ゆきやま・ゆうやけビーチ',17,'#fff'],['マグマじょう',17,'#ff8a3d'],['ドパドパランド',17,'rainbow'],['',0],
  ['ハイスコア ごうけい',14,'#bfe6ff'],['@SCORE',28,'#ffe14d'],['',0],['あそんでくれて',22,'#fff'],['ありがとう！',26,'rainbow']];
function startEnding(){
  mode='ending';endT=0;endStage=0;show(null);$('pauseBtn').hidden=true;$('endUi').hidden=true;
  parts.length=0;pops.length=0;duck(0,0.8);SFX.clear();setTimeout(()=>{if(mode==='ending'){music(6);duck(1,0.4);}},1800);
  if(!G)newRun(20,true);
}
function updateEnding(dt){
  endT+=dt;
  if(Math.random()<dt*(endT<3?4:2.2)){const x=rand(30,W-30),y=rand(50,H*0.45),col=pick(RAINBOW);
    burst(x,y,46,[col,'#fff',pick(RAINBOW)],250,{kind:'star',g:50,w:false,life:1.7});ring(x,y,col,6,false);
    if(AC){note(rand(500,900),0.25,'triangle',0.06,now(),0,rand(150,300));nz(0.3,0.08,1500,'lowpass',now()+0.05);}}
  if(Math.random()<dt*14)addP({x:rand(0,W),y:-10,vx:rand(-30,30),vy:rand(50,120),g:40,life:0,max:4,size:rand(4,8),col:pick(RAINBOW),kind:'confetti',rot:rand(0,6),vr:rand(-10,10),w:false});
  if(endT>4&&$('endUi').hidden)$('endUi').hidden=false;
  if(endStage===0&&endT>creditsEnd()){endStage=1;bigPop('おわり','rainbow',64,99);SFX.praise();}
}
function creditsEnd(){return (H*0.4+CREDITS.length*34+30)/45;}
function drawEnding(){
  const t=endT;
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#160f38');sky.addColorStop(0.55,'#4b2a72');sky.addColorStop(1,'#ff9a6a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const a=0.4+0.6*Math.abs(Math.sin(t*2+i));ctx.globalAlpha=a;ctx.fillStyle='#fff';starPath(hash(i)*W,hash(i+9)*H*0.6,1+hash(i+3)*2.2,0,4);ctx.fill();}
  ctx.globalAlpha=1;
  // hill + fish pile
  const gy=H*0.8;
  ctx.fillStyle='#3e9b4b';ell(W/2,gy+H*0.25,W*0.9,H*0.3);ctx.fill();
  ctx.fillStyle='#5cbf5e';ell(W/2,gy+H*0.27,W*0.7,H*0.28);ctx.fill();
  for(let i=0;i<14;i++){const it={type:i%7===3?'gold':'fish',x:W/2+(hash(i)-0.5)*170,ph:i};drawItem(it,gy-6-hash(i+4)*22,t);}
  // spotlight
  const sp=ctx.createRadialGradient(W/2,gy-80,10,W/2,gy-80,170);sp.addColorStop(0,'rgba(255,240,170,.45)');sp.addColorStop(1,'rgba(255,240,170,0)');
  ctx.fillStyle=sp;ctx.fillRect(0,0,W,H);
  // Tenpuru, hopping for joy, with a crown
  const hop=Math.max(0,Math.sin(t*4))*16,s=2.6,cy=gy-hop;
  ctx.fillStyle='rgba(0,0,0,.25)';ell(W/2,gy+2,36-hop*0.6,9);ctx.fill();
  drawCat(W/2,cy,s,{run:t*3,face:Math.floor(t/2.5)%2?'fever':'happy',t,sy:1+(hop>0?0.04:0)});
  ctx.save();ctx.translate(W/2,cy-s*50);ctx.rotate(Math.sin(t*4)*0.08);
  ctx.fillStyle='#ffd23f';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-22,8);ctx.lineTo(-24,-14);ctx.lineTo(-12,-2);ctx.lineTo(0,-20);ctx.lineTo(12,-2);ctx.lineTo(24,-14);ctx.lineTo(22,8);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff4f7e';ell(0,0,4,4);ctx.fill();ctx.fillStyle='#4fc3ff';ell(-13,3,3,3);ctx.fill();ell(13,3,3,3);ctx.fill();
  ctx.restore();
  drawParts(G);
  // credits roll
  const total=Object.values(save.best).reduce((a,b)=>a+b,0);
  let y=H*0.4+10-t*45;
  for(const [line,size,col] of CREDITS){
    if(line&&y>-30&&y<H*0.4){const a=clamp((y+10)/60,0,1)*clamp((H*0.4-y)/40,0,1);ctx.globalAlpha=a;txt(line==='@SCORE'?String(total):line,W/2,y,size,col,size*0.25);}
    y+=34;
  }
  ctx.globalAlpha=1;
  drawPops();
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(nw){
  const dt=Math.min(0.05,(nw-last)/1000);last=nw;
  if(mode==='ending'){updateEnding(dt);updateFX(dt);}
  else if(mode!=='pause'){update(dt);updateFX(dt);}
  render();requestAnimationFrame(frame);
}
function resize(){
  const r=wrap.getBoundingClientRect();if(r.width<10)return;
  dpr=Math.min(window.devicePixelRatio||1,2.5);scale=r.width/W;H=r.height/scale;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  PY=H*0.72;if(G)G.py=clamp(G.py,PYMIN(),PYMAX());
}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(wrap);

/* ---------- screens ---------- */
function show(id){['title','select','pause','result'].forEach(k=>$(k).hidden=k!==id);$('endUi').hidden=true;}
function goTitle(){mode='title';show('title');$('pauseBtn').hidden=true;startDemo();music(7);duck(1);}
function goSelect(){
  mode='select';show('select');$('pauseBtn').hidden=true;if(!G||!G.demo)startDemo();music(7);duck(1);
  const grid=$('grid');grid.innerHTML='';
  for(let n=1;n<=20;n++){
    const b=document.createElement('button');const locked=n>save.unlocked,st=save.stars[n]||0;
    b.className='tile '+(locked?'locked':n>15?'hard':'');if(!locked&&n<=15)b.style.background=THEMES[themeOf(n)].tile;
    b.innerHTML='<span class="num">'+(locked?'🔒':n)+'</span><span class="st">'+(locked?'':'<b>'+'★'.repeat(st)+'</b>'+'★'.repeat(3-st))+'</span>';
    b.setAttribute('aria-label','ステージ '+n+(locked?' まだ ひらいていない':' ほし '+st));
    b.onclick=()=>{if(locked){SFX.wall();b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:200});return;}SFX.click();startStage(n);};
    grid.appendChild(b);
  }
  $('selEnd').hidden=!save.stars[20];
}
function startStage(n){
  newRun(n,false);mode='play';show(null);$('pauseBtn').hidden=false;music(stageTrack(n));duck(1,0.4);
  stick.id=null;input.jx=input.jy=0;
}
function pauseGame(){if(mode!=='play'||!G||G.state==='dead'||G.state==='clear')return;mode='pause';show('pause');bgmPause();}
function resumeGame(){mode='play';show(null);music(stageTrack(G.n));}
function showResult(ok){
  const g=G;mode='result';show('result');
  const tag=$('rsTag'),ti=$('rsTitle'),msg=$('rsMsg');
  tag.textContent='ステージ '+g.n+'  '+THEMES[g.p.theme].name;
  const stars=ok?(g.hits===0?3:g.hits===1?2:1):0;
  [...$('rsStars').children].forEach((s,i)=>{s.classList.remove('on');if(i<stars)setTimeout(()=>{s.classList.add('on');SFX.bonus();},400+i*300);});
  $('rsStars').hidden=!ok;
  $('rsFish').textContent=g.fish+'/'+g.fishTotal;$('rsCombo').textContent=g.maxCombo;
  let best=false;
  if(ok){
    ti.className='';ti.textContent=g.n===20?'ぜんステージ クリア！':'ステージクリア！';
    msg.textContent=g.n===20?'てんぷるは でんせつの ねこに なった！':stars===3?'ノーミス！ てんぷる かんぺき！':stars===2?'おしい！ あと ちょっとで ノーミス！':'クリア おめでとう！';
    save.stars[g.n]=Math.max(save.stars[g.n]||0,stars);if(g.n<20)save.unlocked=Math.max(save.unlocked,g.n+1);
    if(g.score>(save.best[g.n]||0)){save.best[g.n]=g.score;best=true;}persist();
    $('rsNext').hidden=false;$('rsNext').textContent=g.n>=20?'エンディングへ ▶':'つぎへ ▶';
  }else{
    ti.className='fail';ti.textContent='ざんねん…';
    msg.textContent='ゴールまで あと '+Math.max(1,Math.round(100-g.dist/g.p.length*100))+'%！ もういっかい いこう！';
    $('rsNext').hidden=true;
  }
  $('rsRetry').textContent=ok?'もういちど':'もういっかい！';
  $('rsBest').hidden=!best;
  const el=$('rsScore'),target=g.score,t0=performance.now();
  (function cnt(){const u=Math.min(1,(performance.now()-t0)/900);el.textContent=Math.round(target*u);if(u<1)requestAnimationFrame(cnt);})();
  setTimeout(()=>($(ok&&g.n<20?'rsNext':'rsRetry')).focus({preventScroll:true}),50);
}
$('playBtn').onclick=()=>{initAudio();SFX.click();goSelect();};
$('selBack').onclick=()=>{SFX.click();goTitle();};
$('pauseBtn').onclick=()=>{SFX.click();pauseGame();};
$('pResume').onclick=()=>{SFX.click();resumeGame();};
$('pRetry').onclick=()=>{SFX.click();startStage(G.n);};
$('pQuit').onclick=()=>{SFX.click();goSelect();};
$('rsNext').onclick=()=>{SFX.click();if(G.n>=20)startEnding();else startStage(G.n+1);};
$('endBtn').onclick=()=>{SFX.click();goTitle();};
$('selEnd').onclick=()=>{SFX.click();startEnding();};
(function(){let tm=null;const h=$('selHead');
  h.addEventListener('pointerdown',()=>{tm=setTimeout(()=>{save.unlocked=20;persist();SFX.power();goSelect();},2000);});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>h.addEventListener(t,()=>clearTimeout(tm)));})();
$('rsRetry').onclick=()=>{SFX.click();startStage(G.n);};
$('rsSel').onclick=()=>{SFX.click();goSelect();};
$('muteBtn').onclick=$('pMute').onclick=()=>{initAudio();setMuted(!muted);SFX.click();};
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();if(bgm)bgm.pause();}else if(bgmOn)bgmPlay();});

/* ---------- input ---------- */
// split screen: left half = floating stick (centre is wherever the thumb lands), right half = tap to jump (fires on touch-down)
const STICK_R=56;
function stickUpdate(){
  let dx=stick.x-stick.ox,dy=stick.y-stick.oy;const d=Math.hypot(dx,dy);
  if(d>STICK_R){stick.ox=stick.x-dx/d*STICK_R;stick.oy=stick.y-dy/d*STICK_R;dx=stick.x-stick.ox;dy=stick.y-stick.oy;}
  const m=Math.hypot(dx,dy);const k=m<6?0:Math.min(1,(m-6)/(STICK_R-6));
  input.jx=m?dx/m*k:0;input.jy=m?dy/m*k:0;
}
function cvPos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(mode!=='play')return;
  if(G&&G.state==='clear'&&!G.shown&&G.endT>0.4){G.shown=true;showResult(true);return;}
  const [x,y]=cvPos(e);
  if(x>cv.getBoundingClientRect().width/2||stick.id!==null){requestJump();return;}
  Object.assign(stick,{id:e.pointerId,ox:x,oy:y,x,y,t:performance.now(),moved:false});
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{if(stick.id!==e.pointerId)return;const [x,y]=cvPos(e);stick.x=x;stick.y=y;
  if(Math.hypot(x-stick.ox,y-stick.oy)>12)stick.moved=true;stickUpdate();});
const endStick=e=>{if(stick.id!==e.pointerId)return;
  stick.id=null;input.jx=input.jy=0;};
['pointerup','pointercancel','lostpointercapture'].forEach(t=>cv.addEventListener(t,endStick));
function drawStick(){
  if(stick.id===null||!stick.moved)return;
  const ox=stick.ox/scale,oy=stick.oy/scale,R0=STICK_R/scale;
  ctx.globalAlpha=0.35;ctx.fillStyle='#fff';ell(ox,oy,R0,R0);ctx.fill();ctx.globalAlpha=0.7;ctx.strokeStyle=INK;ctx.lineWidth=3;ell(ox,oy,R0,R0);ctx.stroke();
  ctx.globalAlpha=0.85;ctx.fillStyle='#ff5fa2';ell(ox+input.jx*R0,oy+input.jy*R0,R0*0.45,R0*0.45);ctx.fill();ctx.stroke();ctx.globalAlpha=1;
}
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a')input.kL=true;else if(k==='ArrowRight'||k==='d')input.kR=true;
  else if(k==='ArrowUp'||k==='w')input.kU=true;else if(k==='ArrowDown'||k==='s')input.kD=true;
  else if(k===' '||k==='z'||k==='Enter'){if(mode==='play'){e.preventDefault();requestJump();}}
  else if(k==='Escape'||k==='p'){mode==='pause'?resumeGame():pauseGame();}
});
window.addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')input.kL=false;if(k==='ArrowRight'||k==='d')input.kR=false;if(k==='ArrowUp'||k==='w')input.kU=false;if(k==='ArrowDown'||k==='s')input.kD=false;});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.grid'))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* ---------- boot ---------- */
(function logo(){
  document.querySelectorAll('.logo .row').forEach((row,ri)=>{const s=row.textContent;row.textContent='';[...s].forEach((ch,i)=>{const sp=document.createElement('span');sp.className='ch';sp.textContent=ch;
    sp.style.animationDelay=(ri*0.3+i*0.08)+'s';sp.style.color=ri?['#ffcf3f','#ff7eb6','#4fc3ff','#7be37b'][i%4]:'#fff';row.appendChild(sp);});});
})();
if(/^#(all|zenbu)$/.test(location.hash)){save.unlocked=20;persist();}
setMuted(muted);
resize();goTitle();
if(location.hash==="#ending")startEnding();
if(document.fonts&&document.fonts.load)document.fonts.load('20px "Dela Gothic One"').catch(()=>{});
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
